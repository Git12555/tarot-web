@keyframes shimmer {

.nav-link { position: relative; }
.nav-link::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--color-primary-400), transparent);

@keyframes particleFloat {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }

}

.element-wood { color: #4ADE80; }

input[type="date"], input[type="time"], select {

<script>
const tianGan = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
const diZhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

const tianGanElement = { '甲': '木', '乙': '木', '丙': '火', '丁': '火', '戊': '土', '己': '土', '庚': '金', '辛': '金', '壬': '水', '癸': '水' };
const diZhiElement = { '子': '水', '丑': '土', '寅': '木', '卯': '木', '辰': '土', '巳': '火', '午': '火', '未': '土', '申': '金', '酉': '金', '戌': '土', '亥': '水' };

const elementIcons = { '木': '🌲', '火': '🔥', '土': '⛰️', '金': '⚔️', '水': '💧' };
const elementNames = { '木': 'wood', '火': 'fire', '土': 'earth', '金': 'metal', '水': 'water' };

const zodiacAnimals = { '子': '鼠', '丑': '牛', '寅': '虎', '卯': '兔', '辰': '龙', '巳': '蛇', '午': '马', '未': '羊', '申': '猴', '酉': '鸡', '戌': '狗', '亥': '猪' };

function getYearGanZhi(year) {
  const ganIndex = (year - 4) % 10;
  const zhiIndex = (year - 4) % 12;
  return { gan: tianGan[ganIndex], zhi: diZhi[zhiIndex] };
}

function getMonthGanZhi(year, month) {
  const yearGan = tianGan.indexOf(getYearGanZhi(year).gan);
  const monthZhiIndex = (month + 1) % 12;
  let monthGanIndex;
  
  if (yearGan % 5 === 0 || yearGan % 5 === 4) {
    monthGanIndex = (2 + month - 1) % 10;
  } else if (yearGan % 5 === 1 || yearGan % 5 === 5) {
    monthGanIndex = (4 + month - 1) % 10;
  } else if (yearGan % 5 === 2 || yearGan % 5 === 6) {
    monthGanIndex = (6 + month - 1) % 10;
  } else if (yearGan % 5 === 3 || yearGan % 5 === 7) {
    monthGanIndex = (8 + month - 1) % 10;
  } else {
    monthGanIndex = (0 + month - 1) % 10;
  }
  
  return { gan: tianGan[monthGanIndex], zhi: diZhi[monthZhiIndex] };
}

function getDayGanZhi(year, month, day) {
  const baseDate = new Date(1900, 0, 1);
  const targetDate = new Date(year, month - 1, day);
  const diffDays = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
  const ganIndex = (diffDays + 9) % 10;
  const zhiIndex = (diffDays + 1) % 12;
  return { gan: tianGan[ganIndex], zhi: diZhi[zhiIndex] };
}

function getHourGanZhi(dayGan, hour) {
  const dayGanIndex = tianGan.indexOf(dayGan);
  let hourZhiIndex;
  
  if (hour >= 23 || hour < 1) hourZhiIndex = 0;
  else if (hour >= 1 && hour < 3) hourZhiIndex = 1;
  else if (hour >= 3 && hour < 5) hourZhiIndex = 2;
  else if (hour >= 5 && hour < 7) hourZhiIndex = 3;
  else if (hour >= 7 && hour < 9) hourZhiIndex = 4;
  else if (hour >= 9 && hour < 11) hourZhiIndex = 5;
  else if (hour >= 11 && hour < 13) hourZhiIndex = 6;
  else if (hour >= 13 && hour < 15) hourZhiIndex = 7;
  else if (hour >= 15 && hour < 17) hourZhiIndex = 8;
  else if (hour >= 17 && hour < 19) hourZhiIndex = 9;
  else if (hour >= 19 && hour < 21) hourZhiIndex = 10;
  else hourZhiIndex = 11;
  
  let hourGanIndex;
  if (dayGanIndex % 5 === 0 || dayGanIndex % 5 === 4) {
    hourGanIndex = hourZhiIndex;
  } else if (dayGanIndex % 5 === 1 || dayGanIndex % 5 === 5) {
    hourGanIndex = (hourZhiIndex + 2) % 10;
  } else if (dayGanIndex % 5 === 2 || dayGanIndex % 5 === 6) {
    hourGanIndex = (hourZhiIndex + 4) % 10;
  } else if (dayGanIndex % 5 === 3 || dayGanIndex % 5 === 7) {
    hourGanIndex = (hourZhiIndex + 6) % 10;
  } else {
    hourGanIndex = (hourZhiIndex + 8) % 10;
  }
  
  return { gan: tianGan[hourGanIndex], zhi: diZhi[hourZhiIndex] };
}

function calculateBazi() {
  const dateInput = document.getElementById('birth-date').value;
  const timeInput = document.getElementById('birth-time').value;
  const gender = document.getElementById('gender').value;
  
  if (!dateInput) {
    alert('请选择出生日期');
    return;
  }
  
  const date = new Date(dateInput);
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  
  const hour = timeInput ? parseInt(timeInput.split(':')[0]) : 12;
  
  const yearPillar = getYearGanZhi(year);
  const monthPillar = getMonthGanZhi(year, month);
  const dayPillar = getDayGanZhi(year, month, day);
  const hourPillar = getHourGanZhi(dayPillar.gan, hour);
  
  const pillars = [
    { name: '年柱', ...yearPillar, animal: zodiacAnimals[yearPillar.zhi] },
    { name: '月柱', ...monthPillar },
    { name: '日柱', ...dayPillar, isDayMaster: true },
    { name: '时柱', ...hourPillar }
  ];
  
  renderPillars(pillars);
  renderWuxingAnalysis(pillars);
  renderBaziReading(pillars, gender);
  
  const resultSection = document.getElementById('bazi-result');
  resultSection.style.display = 'block';
  setTimeout(() => resultSection.classList.add('show'), 100);
  resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderPillars(pillars) {
  const container = document.getElementById('bazi-pillars');
  container.innerHTML = '';
  
  pillars.forEach((pillar, index) => {
    const ganElement = tianGanElement[pillar.gan];
    const zhiElement = diZhiElement[pillar.zhi];
    const ganElementClass = elementNames[ganElement];
    const zhiElementClass = elementNames[zhiElement];
    
    const pillarDiv = document.createElement('div');
    pillarDiv.className = 'bazi-pillar glass-panel rounded-xl p-4 sm:p-6 text-center';
    pillarDiv.style.border = `1px solid rgba(201, 169, 110, 0.2)`;
    pillarDiv.style.animationDelay = (index * 0.15) + 's';
    pillarDiv.style.opacity = '0';
    pillarDiv.style.animation = `dealCard 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) ${index * 0.15}s forwards`;
    
    pillarDiv.innerHTML = `
      <div class="text-xs mb-3" style="color: #8A8278; font-family: 'Noto Sans SC', sans-serif;">${pillar.name}</div>
      <div class="bg-element-${ganElementClass} rounded-lg p-3 mb-2 border">
        <div class="text-3xl sm:text-4xl font-bold element-${ganElementClass}" style="font-family: 'Noto Serif SC', serif;">${pillar.gan}</div>
        <div class="text-xs mt-1 element-${ganElementClass}" style="font-family: 'Noto Sans SC', sans-serif;">${elementIcons[ganElement]} ${ganElement}</div>
      </div>
      <div class="bg-element-${zhiElementClass} rounded-lg p-3 border">
        <div class="text-3xl sm:text-4xl font-bold element-${zhiElementClass}" style="font-family: 'Noto Serif SC', serif;">${pillar.zhi}</div>
        <div class="text-xs mt-1 element-${zhiElementClass}" style="font-family: 'Noto Sans SC', sans-serif;">
          ${pillar.animal ? elementIcons[zhiElement] + ' ' + pillar.animal : elementIcons[zhiElement] + ' ' + zhiElement}
        </div>
      </div>
      ${pillar.isDayMaster ? '<div class="text-xs mt-3 px-2 py-1 rounded-full inline-block" style="background: rgba(201, 169, 110, 0.2); color: #C9A96E;">日主</div>' : ''}
    `;
    
    container.appendChild(pillarDiv);
  });
}

function renderWuxingAnalysis(pillars) {
  const counts = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
  
  pillars.forEach(pillar => {
    counts[tianGanElement[pillar.gan]]++;
    counts[diZhiElement[pillar.zhi]]++;
  });
  
  const total = 8;
  const container = document.getElementById('wuxing-analysis');
  container.innerHTML = '';
  
  Object.keys(counts).forEach(element => {
    const count = counts[element];
    const percentage = (count / total) * 100;
    const elementClass = elementNames[element];
    
    const row = document.createElement('div');
    row.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm element-${elementClass}" style="font-family: 'Noto Sans SC', sans-serif;">${elementIcons[element]} ${element}元素</span>
        <span class="text-sm" style="color: #B8B0A0; font-family: 'Noto Sans SC', sans-serif;">${count} / ${total}</span>
      </div>
      <div class="w-full h-2 rounded-full" style="background: rgba(255, 255, 255, 0.1);">
        <div class="h-full rounded-full transition-all duration-1000" style="width: ${percentage}%; background: ${getElementColor(element)}; box-shadow: 0 0 10px ${getElementColor(element)}60;"></div>
      </div>
    `;
    container.appendChild(row);
  });
}

function getElementColor(element) {
  const colors = { '木': '#4ADE80', '火': '#F87171', '土': '#EAB308', '金': '#94A3B8', '水': '#60A5FA' };
  return colors[element] || '#C9A96E';
}

function renderBaziReading(pillars, gender) {
  const dayMaster = tianGanElement[pillars[2].gan];
  const dayMasterGan = pillars[2].gan;
  
  const counts = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
  pillars.forEach(pillar => {
    counts[tianGanElement[pillar.gan]]++;
    counts[diZhiElement[pillar.zhi]]++;
  });
  
  let mostElement = '木';
  let mostCount = 0;
  let leastElement = '木';
  let leastCount = 10;
  
  Object.keys(counts).forEach(e => {
    if (counts[e] > mostCount) { mostCount = counts[e]; mostElement = e; }
    if (counts[e] < leastCount) { leastCount = counts[e]; leastElement = e; }
  });
  
  const readings = {
    '木': {
      strong: '您的日主为木，命局中木气旺盛。您天生具有仁慈、正直的品格，富有同情心和正义感。性格坚韧不拔，如参天大树般向上生长。适合从事教育、文化、艺术等领域。',
      weak: '您的日主为木，命局中木气稍弱。您可能需要更多地培养自己的决断力和行动力。建议多接触大自然，佩戴绿色饰品，以增强木元素的能量。'
    },
    '火': {
      strong: '您的日主为火，命局中火气旺盛。您热情开朗，富有感染力和领导力。思维敏捷，行动力强，如烈火般充满活力。适合从事管理、娱乐、销售等领域。',
      weak: '您的日主为火，命局中火气稍弱。您可能需要更多地培养自己的热情和表达能力。建议多参加社交活动，佩戴红色饰品，以增强火元素的能量。'
    },
    '土': {
      strong: '您的日主为土，命局中土气旺盛。您诚实守信，踏实稳重，有强烈的责任感和担当精神。如大地般承载万物，值得信赖。适合从事金融、建筑、农业等领域。',
      weak: '您的日主为土，命局中土气稍弱。您可能需要更多地培养自己的稳定性和耐心。建议多接触大地，佩戴黄色饰品，以增强土元素的能量。'
    },
    '金': {
      strong: '您的日主为金，命局中金气旺盛。您坚毅果断，讲义气，有强烈的原则和底线。如金属般锐利而坚韧，追求完美。适合从事金融、法律、科技等领域。',
      weak: '您的日主为金，命局中金气稍弱。您可能需要更多地培养自己的决断力和原则性。建议多接触金属饰品，佩戴白色或金色饰品，以增强金元素的能量。'
    },
    '水': {
      strong: '您的日主为水，命局中水气旺盛。您聪慧灵敏，善于变通，有很强的适应能力和直觉力。如流水般灵动，能够顺势而为。适合从事咨询、策划、贸易等领域。',
      weak: '您的日主为水，命局中水气稍弱。您可能需要更多地培养自己的灵活性和沟通能力。建议多接触水，佩戴黑色或蓝色饰品，以增强水元素的能量。'
    }
  };
  
  const isStrong = counts[dayMaster] >= 3;
  const baseReading = readings[dayMaster][isStrong ? 'strong' : 'weak'];
  
  const zodiac = zodiacAnimals[pillars[0].zhi];
  const fullReading = `${baseReading}

您出生于${pillars[0].gan}${pillars[0].zhi}年（${zodiac}年），生肖属${zodiac}。
命局中${mostElement}元素最旺（${mostCount}个），代表您在${getElementTrait(mostElement)}方面有突出的天赋。
${leastElement}元素相对较弱（${leastCount}个），可以在生活中适当补充${leastElement}元素的能量。

${gender === 'male' ? '男命以正财为妻，偏财为父。' : '女命以正官为夫，七杀为情人。'}
${dayMasterGan}日主的人，性格中带有${getDayMasterTrait(dayMasterGan)}的特质。`;
  
  document.getElementById('bazi-reading').innerText = fullReading;
}

function getElementTrait(element) {
  const traits = {
    '木': '创造力、领导力、仁慈',
    '火': '热情、表达、社交',
    '土': '稳重、务实、可靠',
    '金': '坚毅、公正、严谨',
    '水': '智慧、灵活、直觉'
  };
  return traits[element] || '';
}

function getDayMasterTrait(gan) {
  const traits = {
    '甲': '正直、进取、有领导力',
    '乙': '温柔、灵活、善于协调',
    '丙': '热情、开朗、有感染力',
    '丁': '细腻、专注、有恒心',
    '戊': '稳重、诚信、有担当',
    '己': '包容、务实、善谋划',
    '庚': '刚毅、果断、讲义气',
    '辛': '精致、严谨、有品味',
    '壬': '聪慧、灵活、有谋略',
    '癸': '敏感、细腻、有直觉'
  };
  return traits[gan] || '';
}

function resetBazi() {
  document.getElementById('bazi-result').style.display = 'none';
  document.getElementById('bazi-result').classList.remove('show');
  document.querySelector('.glass-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const mobileMenuBtn = document.getElementById('mobile-menu-btn');
const mobileNav = document.getElementById('mobile-nav');
let menuOpen = false;
if (mobileMenuBtn) {
  mobileMenuBtn.addEventListener('click', function() {
    menuOpen = !menuOpen;
    if (menuOpen) {
      mobileNav.style.maxHeight = '300px';
    } else {
      mobileNav.style.maxHeight = '0';
    }
  });
}

const header = document.getElementById('main-header');
if (header) {
  window.addEventListener('scroll', function() {
    header.style.background = window.scrollY > 50 ? 'rgba(13, 13, 20, 0.95)' : 'rgba(13, 13, 20, 0.6)';
    header.style.borderColor = window.scrollY > 50 ? 'rgba(201, 169, 110, 0.15)' : 'transparent';
  });
}

const particlesContainer = document.getElementById('particles');
if (particlesContainer) {
  for (let i = 0; i < 15; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 8 + 's';
    particle.style.animationDuration = (6 + Math.random() * 6) + 's';
    const size = 2 + Math.random() * 4;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particlesContainer.appendChild(particle);
  }
}

const observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
document.querySelectorAll('.fade-in').forEach(function(el) { observer.observe(el); });
</script>
