:root {
  --color-primary: #C9A96E;
  --color-primary-light: #E2CFA0;
  --color-primary-dark: #A68B4B;
  --bg-primary: #0D0D14;
  --bg-secondary: #161622;
  --bg-tertiary: #1E1E2E;
  --text-primary: #F5F0E8;
  --text-secondary: #B8B0A0;
  --text-tertiary: #8A8278;
  --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.text-gradient-gold {
  background: linear-gradient(135deg, var(--color-primary-200), var(--color-primary-400), var(--color-primary-600));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.glass-panel {
  background: rgba(26, 26, 42, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.mystical-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--color-primary-400), transparent);
  opacity: 0.3;
}
html { scroll-behavior: smooth; }
.fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
.fade-in.visible { opacity: 1; transform: translateY(0); }
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.shimmer-text {
  background: linear-gradient(90deg, var(--color-primary-200), var(--color-primary-400), var(--color-primary-200));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s linear infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}
.float-animation { animation: float 3s ease-in-out infinite; }
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px rgba(201, 169, 110, 0.3); }
  50% { box-shadow: 0 0 40px rgba(201, 169, 110, 0.5); }
}
.pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
@keyframes cardShuffle {
  0% { transform: translateX(0) translateY(0) rotate(0deg) scale(1); }
  15% { transform: translateX(-30px) translateY(-40px) rotate(-15deg) scale(1.15); }
  30% { transform: translateX(35px) translateY(-25px) rotate(12deg) scale(0.9); }
  45% { transform: translateX(-25px) translateY(-50px) rotate(-18deg) scale(1.1); }
  60% { transform: translateX(40px) translateY(-20px) rotate(10deg) scale(0.95); }
  75% { transform: translateX(-15px) translateY(-45px) rotate(-8deg) scale(1.05); }
  100% { transform: translateX(0) translateY(0) rotate(0deg) scale(1); }
}
@keyframes dealCard {
  0% { opacity: 0; transform: translateY(-120px) rotate(-15deg) scale(0.5); }
  60% { opacity: 1; transform: translateY(10px) rotate(5deg) scale(1.1); }
  100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
}
@keyframes cardFlip {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(180deg); }
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(201, 169, 110, 0.3); }
  50% { box-shadow: 0 0 40px rgba(201, 169, 110, 0.6); }
}
.result-fade { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
.result-fade.show { opacity: 1; transform: translateY(0); }
.card-shuffle { animation: cardShuffle 0.6s ease-in-out; }
.deal-animation { animation: dealCard 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.glow-pulse { animation: glowPulse 1.5s ease-in-out infinite; }
.particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
.particle { position: absolute; width: 4px; height: 4px; background: rgba(201, 169, 110, 0.4); border-radius: 50%; animation: particleFloat 8s infinite ease-in-out; }
@keyframes particleFloat {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
}
.nav-link { position: relative; }
.nav-link::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--color-primary-400), transparent);
  transition: width 0.3s ease;
}
.nav-link:hover::after, .nav-link.active::after { width: 100%; }
.spread-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
.spread-card:hover { transform: translateY(-6px); border-color: rgba(201, 169, 110, 0.4); box-shadow: 0 12px 32px rgba(201, 169, 110, 0.15); }
.spread-card.active { border-color: rgba(201, 169, 110, 0.6); box-shadow: 0 0 30px rgba(201, 169, 110, 0.2); }
.tarot-deck-card {
  position: absolute;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
  cursor: grab;
  transform-style: preserve-3d;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
.tarot-deck-card:active {
  cursor: grabbing;
}
.tarot-deck-card.dragging {
  opacity: 0.8;
  z-index: 1000 !important;
  transform: scale(1.1) !important;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5) !important;
  transition: none;
}
.tarot-deck-card.selected {
  opacity: 0.3;
  filter: brightness(0.5);
}
.tarot-deck-card.hover-over-slot {
  transform: scale(1.2) !important;
  box-shadow: 0 0 30px rgba(201, 169, 110, 0.5) !important;
  border-color: rgba(201, 169, 110, 0.8) !important;
  z-index: 500 !important;
}
.card-flip-container { perspective: 1000px; }
.card-flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
.card-flip-inner.flipped { transform: rotateY(180deg); }
.card-back, .card-front { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 8px; }
.card-back { transform: rotateY(0deg); }
.card-front { transform: rotateY(180deg); }
.selected-slot {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.selected-slot.drag-over {
  transform: scale(1.1);
  border-color: rgba(201, 169, 110, 0.8) !important;
  box-shadow: 0 0 30px rgba(201, 169, 110, 0.5), inset 0 0 20px rgba(201, 169, 110, 0.2) !important;
  background: rgba(201, 169, 110, 0.15) !important;
}
.selected-slot.filled {
  box-shadow: 0 0 25px rgba(201, 169, 110, 0.4);
  border-color: rgba(201, 169, 110, 0.6) !important;
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.drag-preview {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.9;
  transform: translate(-50%, -50%) rotate(5deg) scale(1.1);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

  { id: 77, name: '星币 国王', nameEn: 'King of Pentacles', type: 'minor', suit: 'pentacles', element: '土', meaning: '成功、权威、财富、领导力', desc: '星币国王象征着成功和财富。' }
];

const positionNames = {
  single: ['今日指引'],
  three: ['过去', '现在', '未来'],
  celtic: ['现状', '挑战', '潜意识', '过去', '可能性', '近期未来', '自我态度', '外部环境', '希望与恐惧', '最终结果']
};

const suitSymbols = { swords: '⚔️', cups: '🥃', wands: '🪄', pentacles: '💎' };
const elementColors = { '火': '#F87171', '水': '#60A5FA', '风': '#A78BFA', '土': '#4ADE80' };
const elementIcons = { '火': '🔥', '水': '💧', '风': '💨', '土': '🌍' };

const cardPatterns = [
  { type: 'star' }, { type: 'moon' }, { type: 'eye' }, { type: 'diamond' },
  { type: 'sun' }, { type: 'pentagram' }, { type: 'crescent' }, { type: 'wheel' }
];

let currentSpread = 'three';
let selectedCards = [];
let deckCards = [];
let isShuffling = false;
let isAnimating = false;

let draggedCard = null;
let draggedCardEl = null;
let dragPreview = null;

function getCardPattern(index) {
  const pattern = cardPatterns[index % cardPatterns.length];
  const size = 48, cx = size / 2, cy = size / 2;
  switch(pattern.type) {
    case 'star': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><polygon points="${cx},${cx-14} ${cx+5},${cx-4} ${cx+14},${cx-4} ${cx+7},${cx+3} ${cx+10},${cx+12} ${cx},${cx+6} ${cx-10},${cx+12} ${cx-7},${cx+3} ${cx-14},${cx-4} ${cx-5},${cx-4}" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/><circle cx="${cx}" cy="${cy}" r="3" fill="#C9A96E" opacity="0.5"/></svg>`;
    case 'moon': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><path d="M${cx-6},${cy-12} A12,12 0 0,1 ${cx-6},${cy+12} A8,8 0 0,0 ${cx-6},${cy-12}" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/></svg>`;
    case 'eye': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><ellipse cx="${cx}" cy="${cy}" rx="14" ry="9" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/><circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/><circle cx="${cx}" cy="${cy}" r="3" fill="#C9A96E" opacity="0.6"/></svg>`;
    case 'diamond': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><polygon points="${cx},${cx-14} ${cx+12},${cy} ${cx},${cy+14} ${cx-12},${cy}" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/></svg>`;
    case 'sun': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><circle cx="${cx}" cy="${cy}" r="8" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/></svg>`;
    case 'pentagram': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><polygon points="${cx},${cx-13} ${cx+12},${cx-4} ${cx+8},${cx+11} ${cx-8},${cy+11} ${cx-12},${cx-4}" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/></svg>`;
    case 'crescent': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><path d="M${cx+4},${cy-11} A11,11 0 1,1 ${cx+4},${cy+11} A8,8 0 1,0 ${cx+4},${cy-11}" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/></svg>`;
    case 'wheel': return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" class="w-10 h-10 sm:w-14 sm:h-14"><circle cx="${cx}" cy="${cy}" r="${cx-4}" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/><circle cx="${cx}" cy="${cy}" r="12" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/><circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="#C9A96E" stroke-width="0.6" opacity="0.5"/></svg>`;
    default: return '';
  }
}

function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function getMaxCards() { return currentSpread === 'single' ? 1 : currentSpread === 'three' ? 3 : 10; }

function shuffleDeck() {
  if (isShuffling || isAnimating) return;
  isShuffling = true;
  const shuffleBtn = document.getElementById('shuffle-btn');
  shuffleBtn.disabled = true;
  shuffleBtn.style.opacity = '0.5';

  const deckContainer = document.getElementById('deck-container');
  const cards = deckContainer.querySelectorAll('.tarot-deck-card');

  if (cards.length > 0) {
    cards.forEach((card, index) => {
      card.classList.add('card-shuffle');
      card.style.animationDelay = (index * 0.03) + 's';
    });
  }

  setTimeout(() => {
    selectedCards = [];
    deckCards = shuffleArray([...tarotCards]);
    initDeck(true);
    isShuffling = false;
    shuffleBtn.disabled = false;
    shuffleBtn.style.opacity = '1';
    updateSelectionUI();
    updateSelectionSlots();
  }, 800);
}

function initDeck(withAnimation = false) {
  const deckContainer = document.getElementById('deck-container');
  deckContainer.innerHTML = '';
  if (!deckCards.length) deckCards = shuffleArray([...tarotCards]);

  const maxVisibleCards = Math.min(deckCards.length, 22);
  const displayCards = deckCards.slice(0, maxVisibleCards);
  const isMobile = window.innerWidth < 768;
  const cardWidth = isMobile ? 60 : 80;
  const cardHeight = isMobile ? 90 : 120;

  const containerWidth = deckContainer.offsetWidth || window.innerWidth * 0.8;
  const fanRadius = isMobile ? Math.min(containerWidth * 0.5, 220) : Math.min(containerWidth * 0.4, 300);
  const startAngle = 200;
  const endAngle = 340;
  const angleStep = (endAngle - startAngle) / (displayCards.length - 1 || 1);
  const centerY = isMobile ? 80 : 100;

  displayCards.forEach((card, i) => {
    const angle = (startAngle + i * angleStep) * (Math.PI / 180);
    const x = Math.cos(angle) * fanRadius;
    const y = Math.sin(angle) * fanRadius * 0.5 + centerY;
    const rotation = (angle - Math.PI / 2) * (180 / Math.PI);

    const cardDiv = document.createElement('div');
    cardDiv.className = 'tarot-deck-card';
    cardDiv.style.width = cardWidth + 'px';
    cardDiv.style.height = cardHeight + 'px';
    cardDiv.style.left = '50%';
    cardDiv.style.top = '50%';
    cardDiv.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotation}deg)`;
    cardDiv.style.background = 'linear-gradient(145deg, #2a2a40 0%, #1e1e2e 100%)';
    cardDiv.style.border = '2px solid rgba(201, 169, 110, 0.3)';
    cardDiv.style.borderRadius = '8px';
    cardDiv.style.boxShadow = '0 8px 20px rgba(0,0,0,0.6)';
    cardDiv.style.zIndex = i + 1;
    cardDiv.dataset.cardId = card.id;
    cardDiv.dataset.patternIndex = i;
    cardDiv.dataset.finalX = x;
    cardDiv.dataset.finalY = y;
    cardDiv.dataset.finalRotation = rotation;

    if (withAnimation) {
      cardDiv.style.opacity = '0';
      const randomX = (Math.random() - 0.5) * 200;
      const randomY = (Math.random() - 0.5) * 200;
      const randomRot = (Math.random() - 0.5) * 60;
      cardDiv.style.transform = `translate(calc(-50% + ${randomX}px), calc(-50% + ${randomY}px)) rotate(${randomRot}deg)`;
      setTimeout(() => {
        cardDiv.style.transition = 'opacity 0.5s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
        cardDiv.style.opacity = '1';
        cardDiv.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotation}deg)`;
      }, i * 40);
    }

    cardDiv.innerHTML = `<div class="w-full h-full flex items-center justify-center overflow-hidden rounded-lg" style="backface-visibility: hidden;">${getCardPattern(i)}</div>`;

    cardDiv.addEventListener('mousedown', handleDragStart);
    cardDiv.addEventListener('touchstart', handleDragStart, { passive: false });

    deckContainer.appendChild(cardDiv);
  });
}

function handleDragStart(e) {
  if (isShuffling || isAnimating) return;
  e.preventDefault();
  e.stopPropagation();

  const cardEl = e.currentTarget;
  const cardId = parseInt(cardEl.dataset.cardId);
  const card = tarotCards.find(c => c.id === cardId);
  if (!card) return;

  if (cardEl.classList.contains('selected')) return;

  draggedCard = card;
  draggedCardEl = cardEl;

  dragPreview = document.getElementById('drag-preview');
  dragPreview.innerHTML = cardEl.innerHTML;
  dragPreview.style.width = cardEl.style.width;
  dragPreview.style.height = cardEl.style.height;
  dragPreview.style.display = 'block';
  dragPreview.style.border = cardEl.style.border;
  dragPreview.style.borderRadius = cardEl.style.borderRadius;
  dragPreview.style.background = cardEl.style.background;

  cardEl.classList.add('dragging');
  cardEl.style.zIndex = '999';

  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  updateDragPreviewPosition(clientX, clientY);

  document.addEventListener('mousemove', handleDragMove, true);
  document.addEventListener('touchmove', handleDragMove, { passive: false, capture: true });
  document.addEventListener('mouseup', handleDragEnd, true);
  document.addEventListener('touchend', handleDragEnd, true);
  document.addEventListener('touchcancel', handleDragEnd, true);
}

function handleDragMove(e) {
  if (!draggedCardEl) return;
  e.preventDefault();
  e.stopPropagation();

  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  updateDragPreviewPosition(clientX, clientY);

  const slots = document.querySelectorAll('.selected-slot');
  let hoveredSlotIndex = -1;

  slots.forEach((slot, index) => {
    const rect = slot.getBoundingClientRect();
    const expandPx = 20;
    if (clientX >= rect.left - expandPx && clientX <= rect.right + expandPx &&
        clientY >= rect.top - expandPx && clientY <= rect.bottom + expandPx) {
      hoveredSlotIndex = index;
    }
  });

  slots.forEach((slot, index) => {
    if (index === hoveredSlotIndex) {
      slot.classList.add('drag-over');
    } else {
      slot.classList.remove('drag-over');
    }
  });

  if (hoveredSlotIndex >= 0) {
    draggedCardEl.classList.add('hover-over-slot');
  } else {
    draggedCardEl.classList.remove('hover-over-slot');
  }
}

function handleDragEnd(e) {
  if (!draggedCardEl || !draggedCard) return;

  const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

  let targetSlotIndex = -1;
  const slots = document.querySelectorAll('.selected-slot');

  slots.forEach((slot, index) => {
    slot.classList.remove('drag-over');
    const rect = slot.getBoundingClientRect();
    const expandPx = 20;
    if (clientX >= rect.left - expandPx && clientX <= rect.right + expandPx &&
        clientY >= rect.top - expandPx && clientY <= rect.bottom + expandPx) {
      if (targetSlotIndex === -1) {
        targetSlotIndex = index;
      }
    }
  });

  if (targetSlotIndex >= 0) {
    selectCardForSlot(draggedCard, draggedCardEl, targetSlotIndex);
  } else {
    draggedCardEl.classList.remove('dragging', 'hover-over-slot');
    draggedCardEl.style.zIndex = '';
  }

  draggedCardEl = null;
  draggedCard = null;

  if (dragPreview) {
    dragPreview.style.display = 'none';
  }

  document.removeEventListener('mousemove', handleDragMove, true);
  document.removeEventListener('touchmove', handleDragMove, true);
  document.removeEventListener('mouseup', handleDragEnd, true);
  document.removeEventListener('touchend', handleDragEnd, true);
  document.removeEventListener('touchcancel', handleDragEnd, true);
}

function updateDragPreviewPosition(x, y) {
  if (dragPreview) {
    dragPreview.style.left = x + 'px';
    dragPreview.style.top = y + 'px';
  }
}

function selectCardForSlot(card, cardEl, slotIndex) {
  const maxCards = getMaxCards();

  const existingIndex = selectedCards.findIndex(c => c.id === card.id);
  if (existingIndex > -1) {
    selectedCards.splice(existingIndex, 1);
  }

  if (selectedCards.length >= maxCards) {
    const oldestCard = selectedCards.shift();
    const oldCardEl = document.querySelector(`.tarot-deck-card[data-card-id="${oldestCard.id}"]`);
    if (oldCardEl) {
      oldCardEl.classList.remove('selected');
      oldCardEl.style.zIndex = '';
    }
  }

  if (slotIndex >= selectedCards.length) {
    selectedCards.push(card);
  } else {
    if (selectedCards[slotIndex]) {
      const replacedCard = selectedCards[slotIndex];
      const replacedCardEl = document.querySelector(`.tarot-deck-card[data-card-id="${replacedCard.id}"]`);
      if (replacedCardEl) {
        replacedCardEl.classList.remove('selected');
        replacedCardEl.style.zIndex = '';
      }
    }
    selectedCards[slotIndex] = card;
  }

  cardEl.classList.add('selected');
  cardEl.classList.remove('dragging', 'hover-over-slot');
  cardEl.style.zIndex = '';

  updateSelectionUI();
  updateSelectionSlots();
}

function updateSelectionUI() {
  const maxCards = getMaxCards();
  document.getElementById('selection-count').textContent = `已选 ${selectedCards.length} / ${maxCards} 张`;
  const drawBtn = document.getElementById('draw-btn');
  if (selectedCards.length === maxCards) {
    drawBtn.style.opacity = '1';
    drawBtn.style.pointerEvents = 'auto';
    drawBtn.classList.add('glow-pulse');
  } else {
    drawBtn.style.opacity = '0.5';
    drawBtn.style.pointerEvents = 'none';
    drawBtn.classList.remove('glow-pulse');
  }
}

function updateSelectionSlots() {
  const slotsContainer = document.getElementById('selection-slots');
  const maxCards = getMaxCards();
  slotsContainer.innerHTML = '';

  for (let i = 0; i < maxCards; i++) {
    const slot = document.createElement('div');
    slot.className = 'selected-slot w-16 h-24 sm:w-20 sm:h-28 rounded-xl flex items-center justify-center';
    slot.style.background = 'rgba(37, 37, 56, 0.5)';
    slot.style.border = '2px dashed rgba(201, 169, 110, 0.25)';
    slot.style.transition = 'all 0.3s ease';

    if (i < selectedCards.length) {
      const card = selectedCards[i];
      const elementColor = elementColors[card.element] || '#C9A96E';
      slot.classList.add('filled');
      slot.style.border = `2px solid ${elementColor}80`;
      slot.style.background = `linear-gradient(145deg, rgba(40, 40, 60, 0.95), rgba(30, 30, 50, 0.95))`;
      slot.style.boxShadow = `0 4px 25px ${elementColor}40, inset 0 0 20px ${elementColor}10`;
      slot.innerHTML = `
        <div class="text-center">
          <div class="text-2xl mb-1" style="color: ${elementColor};">${elementIcons[card.element] || ''}</div>
          <div class="text-xs font-semibold" style="color: #E2CFA0; font-family: 'Noto Serif SC', serif;">${card.name}</div>
        </div>`;
    } else {
      slot.innerHTML = `
        <div class="text-center opacity-50">
          <div class="text-2xl mb-1" style="color: #C9A96E;">✦</div>
          <div class="text-xs" style="color: #8A8278; font-family: 'Noto Sans SC', sans-serif;">${positionNames[currentSpread][i] || ''}</div>
        </div>`;
    }
    slotsContainer.appendChild(slot);
  }
}

function selectSpread(spread) {
  currentSpread = spread;
  document.querySelectorAll('.spread-card').forEach(function(card) {
    card.classList.remove('active');
    card.style.border = '1px solid rgba(201, 169, 110, 0.15)';
    card.style.boxShadow = 'none';
  });
  const selectedCard = document.querySelector('.spread-card[data-spread="' + spread + '"]');
  if (selectedCard) {
    selectedCard.classList.add('active');
    selectedCard.style.border = '2px solid rgba(201, 169, 110, 0.6)';
    selectedCard.style.boxShadow = '0 0 30px rgba(201, 169, 110, 0.2)';
  }
  const titles = {
    single: { title: '请拖拽一张牌到下方', desc: '将卡牌拖拽到选择槽位中' },
    three: { title: '请拖拽三张牌到下方', desc: '将卡牌拖拽到选择槽位中' },
    celtic: { title: '请拖拽十张牌到下方', desc: '将卡牌拖拽到选择槽位中' }
  };
  document.getElementById('selection-title').textContent = titles[spread].title;
  document.getElementById('selection-desc').textContent = titles[spread].desc;
  resetSelection();
  document.getElementById('reading-result').style.display = 'none';
}

function resetSelection() {
  selectedCards = [];
  deckCards = shuffleArray([...tarotCards]);
  initDeck(false);
  updateSelectionUI();
  updateSelectionSlots();
}

function drawCards() {
  const maxCards = getMaxCards();
  if (selectedCards.length < maxCards) return;
  isAnimating = true;

  const resultSection = document.getElementById('reading-result');
  resultSection.style.display = 'block';
  const subtitles = {
    single: '单牌占卜 · 今日指引',
    three: '三牌阵 · 过去 · 现在 · 未来',
    celtic: '凯尔特十字 · 深度全面解读'
  };
  document.getElementById('result-subtitle').textContent = subtitles[currentSpread];

  const resultCards = document.getElementById('result-cards');
  resultCards.innerHTML = '';

  const positions = positionNames[currentSpread];
  const displayCount = currentSpread === 'celtic' ? 10 : (currentSpread === 'single' ? 1 : 3);
  const gridCols = currentSpread === 'single' ? 'grid-cols-1 max-w-sm mx-auto' :
                   (currentSpread === 'three' ? 'grid-cols-1 sm:grid-cols-3' : 'grid-cols-2 sm:grid-cols-5');
  resultCards.className = `grid ${gridCols} gap-4 sm:gap-6 mb-12`;

  for (let i = 0; i < displayCount && i < selectedCards.length; i++) {
    const card = selectedCards[i];
    const position = positions[i];
    const elementColor = elementColors[card.element] || '#C9A96E';
    const cardDiv = document.createElement('div');
    cardDiv.className = 'glass-panel rounded-xl p-5 sm:p-6 text-center deal-animation';
    cardDiv.style.border = `1px solid ${elementColor}33`;
    cardDiv.style.animationDelay = (i * 0.15) + 's';

    const suitSymbol = card.suit ? (suitSymbols[card.suit] || '') : '';
    const elementIcon = elementIcons[card.element] || '';
    const cardType = card.type === 'major' ? '大阿卡纳' : `小阿卡纳 · ${getSuitName(card.suit)}`;

    cardDiv.innerHTML = `
      <div class="text-xs font-semibold uppercase tracking-widest mb-4" style="color: #C9A96E; letter-spacing: 0.1em; font-family: 'Noto Sans SC', sans-serif;">${position}</div>
      <div class="card-flip-container w-24 h-36 mx-auto mb-4">
        <div class="card-flip-inner" id="flip-${i}">
          <div class="card-back rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #252538 0%, #1E1E2E 100%); border: 1px solid rgba(201, 169, 110, 0.3);">${getCardPattern(i)}</div>
          <div class="card-front rounded-lg flex flex-col items-center justify-center p-3" style="background: linear-gradient(180deg, #252538 0%, #1E1E2E 100%); border: 1px solid ${elementColor}50;">
            <div class="text-4xl mb-2" style="color: ${elementColor};">${elementIcon}${suitSymbol}</div>
            <div class="text-xs text-center font-display" style="color: ${elementColor}; font-size: 10px; font-family: 'Noto Serif SC', serif;">${card.name}</div>
          </div>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-center gap-2 mb-2">
        <span class="text-xs px-2 py-0.5 rounded-full" style="background: ${elementColor}20; color: ${elementColor}; border: 1px solid ${elementColor}30; font-family: 'Noto Sans SC', sans-serif;">${card.element}元素</span>
        <span class="text-xs px-2 py-0.5 rounded-full" style="background: rgba(201, 169, 110, 0.1); color: #C9A96E; border: 1px solid rgba(201, 169, 110, 0.2); font-family: 'Noto Sans SC', sans-serif;">${cardType}</span>
      </div>
      <h3 class="text-lg font-semibold mb-1" style="color: #E2CFA0; font-family: 'Noto Serif SC', serif;">${card.name}</h3>
      <p class="text-xs mb-2" style="color: #8A8278; font-family: 'Noto Sans SC', sans-serif;">${card.nameEn}</p>
      <p class="text-xs font-medium mb-3" style="color: ${elementColor}; font-family: 'Noto Sans SC', sans-serif;">关键词：${card.meaning}</p>
      <p class="text-sm leading-relaxed" style="color: #B8B0A0; font-family: 'Noto Sans SC', sans-serif;">${card.desc}</p>`;
    resultCards.appendChild(cardDiv);
  }

  generateComprehensiveReading();
  setTimeout(function() { resultSection.classList.add('show'); }, 100);
  resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

  setTimeout(function() {
    for (let i = 0; i < displayCount; i++) {
      setTimeout(function(idx) {
        const flipEl = document.getElementById('flip-' + idx);
        if (flipEl) flipEl.classList.add('flipped');
      }, i * 400, i);
    }
  }, 600);

  setTimeout(function() { isAnimating = false; }, 1500);
}

function getSuitName(suit) {
  const names = { 'swords': '宝剑', 'cups': '圣杯', 'wands': '权杖', 'pentacles': '星币' };
  return names[suit] || '';
}

function generateComprehensiveReading() {
  const elements = selectedCards.map(c => c.element);
  const elementCounts = {};
  elements.forEach(e => { elementCounts[e] = (elementCounts[e] || 0) + 1; });

  let elementAnalysis = '';
  const elementKeys = Object.keys(elementCounts);
  if (elementKeys.length > 0) {
    elementAnalysis = '【元素分析】';
    elementKeys.forEach(key => {
      const count = elementCounts[key];
      const icon = elementIcons[key];
      let meaning = '';
      switch(key) {
        case '火': meaning = '热情、行动力、创造力'; break;
        case '水': meaning = '情感、直觉、治愈'; break;
        case '风': meaning = '思维、沟通、变化'; break;
        case '土': meaning = '稳定、物质、安全感'; break;
      }
      elementAnalysis += `${icon}${key}元素(${count}张)：${meaning}；`;
    });
  }

  let readingText = '';
  if (currentSpread === 'single') {
    readingText = `您抽到的是${selectedCards[0].name}牌。${elementAnalysis}${selectedCards[0].meaning}。${selectedCards[0].desc}建议您在这段时期保持觉察，跟随直觉指引。`;
  }
  else if (currentSpread === 'three') {
    readingText = `从${selectedCards[0].name}（过去）到${selectedCards[1].name}（现在）再到${selectedCards[2].name}（未来），您的牌面呈现出一段完整的生命旅程。${elementAnalysis}综合来看，这段旅程是${getOverallTheme(selectedCards)}。`;
  }
  else {
    readingText = `凯尔特十字牌阵为您揭示了生命的深层图景。${elementAnalysis}这是一个深度内省与成长的时期，${getOverallTheme(selectedCards)}。`;
  }
  document.getElementById('comprehensive-reading').textContent = readingText;
}

function getOverallTheme(cards) {
  const majorCount = cards.filter(c => c.type === 'major').length;
  const minorCount = cards.filter(c => c.type === 'minor').length;
  if (majorCount >= 2) return '一段充满转变和重要启示的时期';
  else if (minorCount >= cards.length - 1) return '一段关注日常生活和实际事务的时期';
  const elements = cards.map(c => c.element);
  if (elements.includes('火') && elements.includes('风')) return '充满行动力和创新思维的时期';
  if (elements.includes('水') && elements.includes('土')) return '情感与物质都将得到滋养的时期';
  if (elements.includes('火') && elements.includes('土')) return '将热情转化为实际成果的时期';
  if (elements.includes('风') && elements.includes('水')) return '思维与情感相互融合的时期';
  return '需要您特别关注内心感受的时期';
}

function resetAll() {
  selectedCards = [];
  deckCards = [];
  initDeck(false);
  updateSelectionUI();
  updateSelectionSlots();
  document.getElementById('reading-result').style.display = 'none';
  document.getElementById('reading-result').classList.remove('show');
  document.getElementById('card-selection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  isAnimating = false;
}

window.addEventListener('resize', function() {
  if (!isShuffling && !isAnimating) {
    initDeck(false);
  }
});

const mobileMenuBtn = document.getElementById('mobile-menu-btn');
const mobileNav = document.getElementById('mobile-nav');
let menuOpen = false;
if (mobileMenuBtn) {
  mobileMenuBtn.addEventListener('click', function() {
    menuOpen = !menuOpen;
    if (menuOpen) {
      mobileNav.style.maxHeight = '300px';
    } else {
      mobileNav.style.maxHeight = '0';
    }
  });
}

const header = document.getElementById('main-header');
if (header) {
  window.addEventListener('scroll', function() {
    header.style.background = window.scrollY > 50 ? 'rgba(13, 13, 20, 0.95)' : 'rgba(13, 13, 20, 0.6)';
    header.style.borderColor = window.scrollY > 50 ? 'rgba(201, 169, 110, 0.15)' : 'transparent';
  });
}

const particlesContainer = document.getElementById('particles');
if (particlesContainer) {
  for (let i = 0; i < 15; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 8 + 's';
    particle.style.animationDuration = (6 + Math.random() * 6) + 's';
    const size = 2 + Math.random() * 4;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particlesContainer.appendChild(particle);
  }
}

const observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
document.querySelectorAll('.fade-in').forEach(function(el) { observer.observe(el); });

initDeck(false);
updateSelectionSlots();
lucide.createIcons();
</script>
